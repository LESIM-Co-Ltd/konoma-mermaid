# cargo-about config for THIRD-PARTY-LICENSES.md.
# Regenerate with: scripts/third-party-licenses.sh
#
# The targets are the ones .github/workflows/release.yml builds. A Linux build links crates a
# macOS build never sees, so all of them are listed. Dev and build dependencies are not shipped.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Licenses present in the dependency tree of the program.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    # webpki-roots ships Mozilla's root certificate bundle under this data license.
    "CDLA-Permissive-2.0",
]
